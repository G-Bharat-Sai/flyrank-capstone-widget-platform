<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlyRank Capstone Dashboard</title>
<style>
    body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; background: #f7f7f8; }
    h1 { font-size: 22px; }
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .summary { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 140px; text-align: center; }
    .stat .value { font-size: 28px; font-weight: 600; }
    .stat .label { font-size: 12px; color: #666; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    input { display: block; width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
    button { padding: 8px 16px; background: #1a1a1a; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #333; }
    .error { color: #c0392b; font-size: 13px; }
    #logoutBtn { background: #999; margin-bottom: 20px; }
    code { background: #f1f1f1; padding: 2px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>

<div id="loginView" class="card">
    <h1>FlyRank Capstone ? Owner Login</h1>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="doLogin()">Log in</button>
    <p class="error" id="loginError"></p>
</div>

<div id="dashboardView" style="display:none;">
    <button id="logoutBtn" onclick="doLogout()">Log out</button>
    <h1>Dashboard</h1>

    <div class="card summary">
        <div class="stat"><div class="value" id="statWidgets">-</div><div class="label">Widgets</div></div>
        <div class="stat"><div class="value" id="statTotal">-</div><div class="label">Total Submissions</div></div>
        <div class="stat"><div class="value" id="stat7">-</div><div class="label">Last 7 Days</div></div>
        <div class="stat"><div class="value" id="stat30">-</div><div class="label">Last 30 Days</div></div>
    </div>

    <div class="card">
        <h2>Submissions per widget</h2>
        <table id="widgetTable"><thead><tr><th>Widget</th><th>Submissions</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
        <h2>Top countries</h2>
        <table id="countryTable"><thead><tr><th>Country</th><th>Submissions</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
        <h2>Submissions per day (last 30 days)</h2>
        <table id="dailyTable"><thead><tr><th>Date</th><th>Submissions</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
        <h2>Your widgets</h2>
        <div id="widgetList"></div>
    </div>
</div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('flyrank_token');

function showView() {
    if (token) {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        loadDashboard();
        loadWidgets();
    } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('dashboardView').style.display = 'none';
    }
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').textContent = '';
    try {
        const res = await fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (!res.ok) {
            document.getElementById('loginError').textContent = 'Login failed. Check your email and password.';
            return;
        }
        const data = await res.json();
        token = data.token;
        localStorage.setItem('flyrank_token', token);
        showView();
    } catch (e) {
        document.getElementById('loginError').textContent = 'Network error. Is the server running?';
    }
}

function doLogout() {
    token = null;
    localStorage.removeItem('flyrank_token');
    showView();
}

async function authedFetch(path) {
    const res = await fetch(API + path, { headers: { Authorization: 'Bearer ' + token } });
    if (res.status === 401 || res.status === 403) {
        doLogout();
        throw new Error('Session expired');
    }
    return res.json();
}

async function loadDashboard() {
    const data = await authedFetch('/dashboard');

    document.getElementById('statWidgets').textContent = data.totalWidgets;
    document.getElementById('statTotal').textContent = data.totalSubmissions;
    document.getElementById('stat7').textContent = data.submissionsLast7Days;
    document.getElementById('stat30').textContent = data.submissionsLast30Days;

    const widgetBody = document.querySelector('#widgetTable tbody');
    widgetBody.innerHTML = data.perWidget.map(w =>
        `<tr><td>${escapeHtml(w.title)}</td><td>${w.submissionCount}</td></tr>`
    ).join('') || '<tr><td colspan="2">No widgets yet</td></tr>';

    const countryBody = document.querySelector('#countryTable tbody');
    countryBody.innerHTML = data.byCountry.map(c =>
        `<tr><td>${escapeHtml(c.country)}</td><td>${c.count}</td></tr>`
    ).join('') || '<tr><td colspan="2">No geo data yet</td></tr>';

    const dailyBody = document.querySelector('#dailyTable tbody');
    dailyBody.innerHTML = data.dailyCounts.map(d =>
        `<tr><td>${d.date}</td><td>${d.count}</td></tr>`
    ).join('') || '<tr><td colspan="2">No submissions in the last 30 days</td></tr>';
}

async function loadWidgets() {
    const widgets = await authedFetch('/widgets');
    const container = document.getElementById('widgetList');
    if (widgets.length === 0) {
        container.innerHTML = '<p>You have not created any widgets yet.</p>';
        return;
    }
    container.innerHTML = widgets.map(w => `
        <div style="margin-bottom:16px;">
            <strong>${escapeHtml(w.title)}</strong> <span style="color:#666;">(${escapeHtml(w.type)})</span><br>
            <code>${escapeHtml(w.embedSnippet)}</code>
        </div>
    `).join('');
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

showView();
</script>

</body>
</html>
